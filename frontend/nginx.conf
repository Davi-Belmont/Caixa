server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # /api/* -> API (a barra final em proxy_pass remove o prefixo /api)
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Documentação Swagger da API (útil na rede local; remova este bloco se expuser à internet)
  location /docs {
    proxy_pass http://api:3000/docs;
    proxy_set_header Host $host;
  }

  # arquivos com hash no nome: cache longo
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # aplicação de página única: qualquer outra rota devolve o index.html (sem cache)
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
